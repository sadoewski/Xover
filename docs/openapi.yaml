openapi: 3.0.3
info:
  title: Hostprint API
  description: |
    REST API для системы управления задачами и документами Hostprint.

    ## Аутентификация

    API использует JWT токены для аутентификации. Получите токен через `/api/auth/login`,
    затем передавайте его в заголовке `Authorization: Bearer <token>` для защищенных endpoints.

    ## Базовый URL

    - Development: `http://localhost:5000`
    - Production: `https://your-domain.com`

    ## Rate Limiting

    - Auth endpoints (`/api/auth/login`, `/api/auth/register`): 5 запросов / 15 минут
    - Остальные endpoints: без ограничений (рекомендуется добавить)

  version: 1.0.0
  contact:
    name: Hostprint Team
  license:
    name: Private

servers:
  - url: http://localhost:5000
    description: Development server
  - url: http://localhost:5000/api
    description: Development API (with prefix)

tags:
  - name: Authentication
    description: Регистрация, вход, профиль пользователя
  - name: Users
    description: Управление пользователями
  - name: Priorities
    description: Приоритеты задач
  - name: Groups
    description: Группы задач и типы групп
  - name: Tasks
    description: Основные задачи
  - name: Events
    description: События календаря
  - name: DataTasks
    description: Data tasks с датами и статусами
  - name: RWPrint
    description: Система управления документами RWPrint
  - name: Sites
    description: Управление сайтами
  - name: Morphology
    description: Морфологический анализ текста
  - name: Health
    description: Health checks

paths:
  # ==================== HEALTH ====================
  /health:
    get:
      tags:
        - Health
      summary: Health check
      description: Проверка доступности API
      responses:
        '200':
          description: API работает
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  message:
                    type: string
                    example: API работает

  # ==================== AUTHENTICATION ====================
  /api/auth/register:
    post:
      tags:
        - Authentication
      summary: Регистрация нового пользователя
      description: |
        Создает нового пользователя и возвращает JWT токен.

        Rate limit: 5 запросов / 15 минут.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - email
                - password
              properties:
                username:
                  type: string
                  minLength: 3
                  maxLength: 50
                  example: john_doe
                email:
                  type: string
                  format: email
                  example: john@example.com
                password:
                  type: string
                  minLength: 6
                  example: securePassword123
      responses:
        '201':
          description: Пользователь создан
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: JWT токен
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: Пользователь уже существует
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Пользователь с таким email уже существует
        '429':
          $ref: '#/components/responses/RateLimitError'

  /api/auth/login:
    post:
      tags:
        - Authentication
      summary: Вход в систему
      description: |
        Аутентификация пользователя и получение JWT токена.

        Rate limit: 5 запросов / 15 минут.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: john@example.com
                password:
                  type: string
                  example: securePassword123
      responses:
        '200':
          description: Успешный вход
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          description: Неверные credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Неверный email или пароль
        '429':
          $ref: '#/components/responses/RateLimitError'

  /api/auth/me:
    get:
      tags:
        - Authentication
      summary: Получить текущего пользователя
      description: Возвращает информацию о текущем аутентифицированном пользователе
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Данные пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/auth/profile:
    put:
      tags:
        - Authentication
      summary: Обновить профиль
      description: Обновляет username и/или email текущего пользователя
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  minLength: 3
                  maxLength: 50
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Профиль обновлен
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Профиль обновлён
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/auth/upload-avatar:
    post:
      tags:
        - Authentication
      summary: Загрузить аватар
      description: Загружает изображение аватара (JPG, PNG)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - avatar
              properties:
                avatar:
                  type: string
                  format: binary
                  description: Изображение (JPG, PNG, max 5MB)
      responses:
        '200':
          description: Аватар загружен
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Аватар успешно загружен
                  avatarUrl:
                    type: string
                    example: /uploads/avatars/1234567890-avatar.jpg
        '400':
          description: Неверный формат файла
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/auth/change-password:
    post:
      tags:
        - Authentication
      summary: Изменить пароль
      description: Меняет пароль текущего пользователя
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - oldPassword
                - newPassword
              properties:
                oldPassword:
                  type: string
                  example: oldPassword123
                newPassword:
                  type: string
                  minLength: 6
                  example: newSecurePassword456
      responses:
        '200':
          description: Пароль изменен
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Пароль успешно изменён
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Неверный старый пароль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Неверный старый пароль

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT токен, полученный через `/api/auth/login` или `/api/auth/register`

  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        username:
          type: string
          example: john_doe
        email:
          type: string
          format: email
          example: john@example.com
        avatar_url:
          type: string
          nullable: true
          example: /uploads/avatars/1234567890-avatar.jpg
        created_at:
          type: string
          format: date-time
          example: "2026-10-04T12:00:00Z"

    Error:
      type: object
      properties:
        error:
          type: string
          description: Сообщение об ошибке
          example: Произошла ошибка

    ValidationErrors:
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                example: email
              message:
                type: string
                example: Некорректный email

  responses:
    UnauthorizedError:
      description: Не авторизован (отсутствует или неверный токен)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Не авторизован

    ValidationError:
      description: Ошибка валидации
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrors'

    RateLimitError:
      description: Превышен лимит запросов
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Слишком много попыток. Попробуйте позже.

  # ==================== PRIORITIES ====================
  /api/priorities:
    get:
      tags:
        - Priorities
      summary: Получить список приоритетов
      description: Возвращает все приоритеты текущего пользователя
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Список приоритетов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Priority'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

    post:
      tags:
        - Priorities
      summary: Создать приоритет
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - color
                - position
              properties:
                name:
                  type: string
                  example: Высокий
                color:
                  type: string
                  pattern: '^#[0-9A-Fa-f]{6}$'
                  example: "#FF0000"
                position:
                  type: integer
                  minimum: 0
                  example: 1
      responses:
        '201':
          description: Приоритет создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Priority'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/priorities/{id}:
    get:
      tags:
        - Priorities
      summary: Получить приоритет по ID
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Данные приоритета
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Priority'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

    put:
      tags:
        - Priorities
      summary: Обновить приоритет
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                color:
                  type: string
                  pattern: '^#[0-9A-Fa-f]{6}$'
                position:
                  type: integer
                  minimum: 0
      responses:
        '200':
          description: Приоритет обновлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Priority'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

    delete:
      tags:
        - Priorities
      summary: Удалить приоритет
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Приоритет удален
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Приоритет удалён
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  # ==================== GROUPS ====================
  /api/groups:
    get:
      tags:
        - Groups
      summary: Получить список групп
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Список групп с типами
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GroupWithTypes'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

    post:
      tags:
        - Groups
      summary: Создать группу
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - color
              properties:
                name:
                  type: string
                  example: Работа
                color:
                  type: string
                  pattern: '^#[0-9A-Fa-f]{6}$'
                  example: "#3B82F6"
      responses:
        '201':
          description: Группа создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/groups/{id}:
    get:
      tags:
        - Groups
      summary: Получить группу по ID
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Данные группы
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

    put:
      tags:
        - Groups
      summary: Обновить группу
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                color:
                  type: string
                  pattern: '^#[0-9A-Fa-f]{6}$'
      responses:
        '200':
          description: Группа обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

    delete:
      tags:
        - Groups
      summary: Удалить группу
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Группа удалена
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Группа удалена
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/groups/{groupId}/types:
    post:
      tags:
        - Groups
      summary: Создать тип группы
      security:
        - BearerAuth: []
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  example: Встреча
      responses:
        '201':
          description: Тип создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupType'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/groups/types/{id}:
    delete:
      tags:
        - Groups
      summary: Удалить тип группы
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Тип удален
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Тип группы удалён
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  # ==================== TASKS ====================
  /api/tasks/date/{date}:
    get:
      tags:
        - Tasks
      summary: Получить задачи по дате
      security:
        - BearerAuth: []
      parameters:
        - name: date
          in: path
          required: true
          schema:
            type: string
            format: date
            example: "2026-10-04"
      responses:
        '200':
          description: Список задач
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/tasks/{id}:
    get:
      tags:
        - Tasks
      summary: Получить задачу по ID
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Данные задачи
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

    put:
      tags:
        - Tasks
      summary: Обновить задачу
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                status:
                  type: string
                  enum: [pending, in_progress, completed, cancelled]
                priority_id:
                  type: integer
                group_id:
                  type: integer
                group_type_id:
                  type: integer
                date:
                  type: string
                  format: date
                time_slot_start:
                  type: string
                  pattern: '^([01]\d|2[0-3]):([0-5]\d)$'
                  example: "09:00"
                time_slot_end:
                  type: string
                  pattern: '^([01]\d|2[0-3]):([0-5]\d)$'
                  example: "10:00"
      responses:
        '200':
          description: Задача обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

    delete:
      tags:
        - Tasks
      summary: Удалить задачу
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Задача удалена
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Задача удалена
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/tasks:
    post:
      tags:
        - Tasks
      summary: Создать задачу
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - date
              properties:
                title:
                  type: string
                  example: Важная встреча
                description:
                  type: string
                  example: Обсудить проект
                status:
                  type: string
                  enum: [pending, in_progress, completed, cancelled]
                  default: pending
                priority_id:
                  type: integer
                group_id:
                  type: integer
                group_type_id:
                  type: integer
                date:
                  type: string
                  format: date
                  example: "2026-10-04"
                time_slot_start:
                  type: string
                  pattern: '^([01]\d|2[0-3]):([0-5]\d)$'
                  example: "09:00"
                time_slot_end:
                  type: string
                  pattern: '^([01]\d|2[0-3]):([0-5]\d)$'
                  example: "10:00"
      responses:
        '201':
          description: Задача создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/tasks/{id}/logs:
    get:
      tags:
        - Tasks
      summary: Получить логи задачи
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: История изменений задачи
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskLog'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/tasks/by-ids:
    post:
      tags:
        - Tasks
      summary: Получить задачи по списку ID
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - ids
              properties:
                ids:
                  type: array
                  items:
                    type: integer
                  example: [1, 2, 3]
      responses:
        '200':
          description: Список задач
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/tasks/link:
    post:
      tags:
        - Tasks
      summary: Связать задачи
