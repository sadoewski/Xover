        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/rwprint/documents/{documentId}/metadata:
    get:
      tags:
        - RWPrint
      summary: Получить метаданные документа
      security:
        - BearerAuth: []
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Метаданные документа
          content:
            application/json:
              schema:
                type: object
                properties:
                  file_size:
                    type: integer
                  created_at:
                    type: string
                    format: date-time
                  updated_at:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  # ==================== SITES ====================
  /api/sites:
    get:
      tags:
        - Sites
      summary: Получить все сайты
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Список сайтов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Site'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

    post:
      tags:
        - Sites
      summary: Создать сайт
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  example: Мой блог
                url:
                  type: string
                  example: https://example.com
      responses:
        '201':
          description: Сайт создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/sites/{id}:
    get:
      tags:
        - Sites
      summary: Получить сайт по ID
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Данные сайта
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

    put:
      tags:
        - Sites
      summary: Обновить сайт
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                url:
                  type: string
      responses:
        '200':
          description: Сайт обновлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

    delete:
      tags:
        - Sites
      summary: Удалить сайт
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Сайт удален
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/sites/{id}/items:
    post:
      tags:
        - Sites
      summary: Создать элемент сайта
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
              properties:
                title:
                  type: string
                content:
                  type: string
                level:
                  type: integer
                parent_id:
                  type: integer
                  nullable: true
      responses:
        '201':
          description: Элемент создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteItem'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/sites/{id}/items/{itemId}:
    put:
      tags:
        - Sites
      summary: Обновить элемент сайта
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                content:
                  type: string
                level:
                  type: integer
                parent_id:
                  type: integer
                  nullable: true
      responses:
        '200':
          description: Элемент обновлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteItem'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

    delete:
      tags:
        - Sites
      summary: Удалить элемент сайта
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Элемент удален
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/sites/{id}/search:
    get:
      tags:
        - Sites
      summary: Поиск по сайту
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Результаты поиска
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SiteItem'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  # ==================== MORPHOLOGY ====================
  /api/morphology/analyze:
    post:
      tags:
        - Morphology
      summary: Морфологический анализ текста
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - text
              properties:
                text:
                  type: string
                  example: Привет мир
      responses:
        '200':
          description: Результат анализа
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: array
                    items:
                      type: object
                      properties:
                        word:
                          type: string
                        normal_form:
                          type: string
                        pos:
                          type: string
                        tags:
                          type: array
                          items:
                            type: string
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

    Priority:
      type: object
      properties:
        id:
          type: integer
          example: 1
        user_id:
          type: integer
        name:
          type: string
          example: Высокий
        color:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          example: "#FF0000"
        position:
          type: integer
          example: 1
        created_at:
          type: string
          format: date-time

    Group:
      type: object
      properties:
        id:
          type: integer
          example: 1
        user_id:
          type: integer
        name:
          type: string
          example: Работа
        color:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          example: "#3B82F6"
        created_at:
          type: string
          format: date-time

    GroupType:
      type: object
      properties:
        id:
          type: integer
        group_id:
          type: integer
        name:
          type: string
          example: Встреча
        created_at:
          type: string
          format: date-time

    GroupWithTypes:
      allOf:
        - $ref: '#/components/schemas/Group'
        - type: object
          properties:
            types:
              type: array
              items:
                $ref: '#/components/schemas/GroupType'

    Task:
      type: object
      properties:
        id:
          type: integer
          example: 1
        user_id:
          type: integer
        title:
          type: string
          example: Важная встреча
        description:
          type: string
          nullable: true
          example: Обсудить проект
        status:
          type: string
          enum: [pending, in_progress, completed, cancelled]
          example: pending
        priority_id:
          type: integer
          nullable: true
        group_id:
          type: integer
          nullable: true
        group_type_id:
          type: integer
          nullable: true
        date:
          type: string
          format: date
          example: "2026-10-04"
        time_slot_start:
          type: string
          nullable: true
          pattern: '^([01]\d|2[0-3]):([0-5]\d)$'
          example: "09:00"
        time_slot_end:
          type: string
          nullable: true
          pattern: '^([01]\d|2[0-3]):([0-5]\d)$'
          example: "10:00"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        priority:
          $ref: '#/components/schemas/Priority'
          nullable: true
        group:
          $ref: '#/components/schemas/Group'
          nullable: true
        group_type:
          $ref: '#/components/schemas/GroupType'
          nullable: true

    TaskLog:
      type: object
      properties:
        id:
          type: integer
        task_id:
          type: integer
        field:
          type: string
          example: status
        old_value:
          type: string
          nullable: true
        new_value:
          type: string
          nullable: true
        changed_at:
          type: string
          format: date-time

    Event:
      type: object
      properties:
        id:
          type: integer
          example: 1
        user_id:
          type: integer
        type:
          type: string
          enum: [birthday, holiday, event]
          example: birthday
        title:
          type: string
          nullable: true
          example: День рождения
        description:
          type: string
          nullable: true
        date_year:
          type: integer
          nullable: true
          example: 2026
        date_month:
          type: integer
          minimum: 1
          maximum: 12
          example: 10
        date_day:
          type: integer
          minimum: 1
          maximum: 31
          example: 15
        created_at:
          type: string
          format: date-time

    EventNote:
      type: object
      properties:
        id:
          type: integer
        event_id:
          type: integer
        content:
          type: string
        created_at:
          type: string
          format: date-time

    DataTask:
      type: object
      properties:
