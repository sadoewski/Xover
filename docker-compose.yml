services:
  # PostgreSQL база данных
  db:
    image: postgres:14-alpine
    container_name: hostprint-db
    restart: unless-stopped
    env_file:
      - .env
    # ✅ ИСПРАВЛЕНО: PostgreSQL больше не exposed на host
    # ports mapping удален для безопасности
    # База доступна только внутри Docker network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 256m
    cpus: 0.5
    networks:
      - hostprint-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hostprint-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=5000
    ports:
      - "5002:5000"
    # ✅ ИСПРАВЛЕНО: uploads теперь persistent
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npm run db:migrate && npm start"
    networks:
      - hostprint-network

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hostprint-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - hostprint-network

volumes:
  # Persistent PostgreSQL data
  postgres_data:
    driver: local

  # ✅ ДОБАВЛЕНО: Persistent uploads (avatars, files)
  uploads_data:
    driver: local

# ✅ ДОБАВЛЕНО: Isolated network для безопасности
networks:
  hostprint-network:
    driver: bridge
